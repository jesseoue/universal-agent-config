  task: openrouter/z-ai/glm-5.3
  advisor: openrouter/deepseek/deepseek-v4-pro-0813
retry:
  maxRetries: 5
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
    - moonshotai/kimi-k2.7-code
    - poolside/laguna-s-2.1
    smol:
    - deepseek/deepseek-v4-flash-0731
    - google/gemini-3.7-flash
    slow:
    - anthropic/claude-opus-5
    - anthropic/claude-sonnet-5
    vision:
    - anthropic/claude-sonnet-5
cycleOrder:
- smol
- default
- slow
modelProviderOrder:
- openrouter
advisor:
  enabled: true
  syncBacklog: 'off'
  immuneTurns: 3
tools:
  read: true
  edit: true
  bash: true
  browser: true
  web_search: true
  approvalMode: normal
thinkingBudgets:
  defaultThinkingLevel: high
  minimal: 1024
  low: 2048
  medium: 4096
  high: 8192
  xhigh: 16384
  max: 32768
compaction:
  strategy: snapcompact
  reserveTokens: 16384
  midTurnEnabled: true
  keepRecentTokens: 20000
  autoContinue: true
logging:
  level: error
  telemetry: false
  redact:
  - OPENROUTER_API_KEY
  - CONTEXT7_API_KEY
  - CLOUDFLARE_API_TOKEN
  - AI_GATEWAY_API_KEY
  - LITELLM_PROXY_API_KEY
  - PORTKEY_API_KEY
  - FAL_KEY
  - REPLICATE_API_TOKEN
mcp:
  enableProjectConfig: true
  renderMarkdownResults: true
