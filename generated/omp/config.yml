modelRoles:
  default: openrouter/anthropic/claude-sonnet-5
  smol: openrouter/deepseek/deepseek-v4-flash-0731
  slow: openrouter/deepseek/deepseek-v4-pro-0813
  plan: openrouter/deepseek/deepseek-v4-pro-0813
  vision: openrouter/google/gemini-3.7-flash
  designer: openrouter/anthropic/claude-sonnet-5
  commit: openrouter/deepseek/deepseek-v4-flash-0731
  tiny: openrouter/deepseek/deepseek-v4-flash-0731
retry:
  maxRetries: 5
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  fallbackChains:
    default:
    - deepseek/deepseek-v4-pro-0813
    - z-ai/glm-5.3
    smol:
    - google/gemini-3.7-flash
    slow:
    - anthropic/claude-opus-5
    - anthropic/claude-sonnet-5
    vision:
    - anthropic/claude-sonnet-5
tools:
  read: true
  edit: true
  bash: true
  browser: true
  web_search: true
  approvalMode: normal
thinkingBudgets:
  defaultThinkingLevel: high
  minimal: 1024
  low: 2048
  medium: 4096
  high: 8192
  xhigh: 16384
  max: 32768
compaction:
  strategy: snapcompact
  reserveTokens: 16384
  keepRecentTokens: 20000
  autoContinue: true
logging:
  level: error
  telemetry: false
  redact:
  - OPENROUTER_API_KEY
  - CONTEXT7_API_KEY
  - CLOUDFLARE_API_TOKEN
  - AI_GATEWAY_API_KEY
  - LITELLM_PROXY_API_KEY
  - PORTKEY_API_KEY
  - FAL_KEY
  - REPLICATE_API_TOKEN
mcp:
  enableProjectConfig: true
  renderMarkdownResults: true
