version: 1
defaults:
  provider: openrouter
  telemetry: false
  preserve_secrets: true
  confirm_destructive_commands: true
  allow_shell: true
  allow_edit: true
  allow_browser: true
  max_retries: 5
  request_timeout_seconds: 300
  stalled_chunk_timeout_seconds: 60
performance:
  description: Default speed and stability policy for agent transports.
  mcp_timeout_seconds: 30
  mcp_startup_timeout_seconds: 10
  reasoning_effort: medium
  background_uses_small_model: true
  tool_output:
    max_lines: 300
    max_bytes: 12000
  compaction:
    auto: true
    prune: true
    reserve_tokens: 16384
    keep_recent_tokens: 20000
    tail_turns: 2
  concurrency:
    default: 10
    provider: 12
    expensive: 5
    analysis: 2
    max_depth: 2
  escalation:
    frontier_default: false
    trigger_after_failed_attempts: 2
    high_blast_radius_only: true
profiles:
  balanced:
    inherits: defaults
  open-weight:
    inherits: defaults
  low-cost:
    inherits: defaults
  frontier:
    inherits: defaults
  implement:
    inherits: defaults
  content-analysis:
    inherits: defaults
    allow_shell: false
    allow_edit: false
    allow_browser: false
advanced:
  description: Explicit opt-in profile for experienced users.
  inherits: defaults
  confirm_destructive_commands: false
openrouter_routing:
  default_strategy: latency
  strategies:
  - latency
  - throughput
  - price
  - auto
  provider_controls:
    sort:
    - price
    - throughput
    - latency
    allow_fallbacks: true
    require_parameters: true
    data_collection: deny
    zdr: true
    ignore: []
  fallbacks:
    models:
    - id: z-ai/glm-5.3
    - id: moonshotai/kimi-k2.7-code
    route: fallback
verification:
  default: required
  read_only_planning: true
  targeted_commands: true
  exact_output_reporting: true
  one_focused_retry: true
frontier_policy:
  default_enabled: false
  requires_explicit_opt_in: true
  trigger_after_failed_attempts: 2
  high_blast_radius_only: true
