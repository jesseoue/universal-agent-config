name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pyyaml pytest tomli-w
      - run: python scripts/refresh_models.py
      - run: python scripts/generate.py
      - run: python scripts/validate.py
      - run: pytest -q
      - run: bash tests/test_installer.sh
      - run: shellcheck scripts/install.sh
      - name: Check generated artifacts
        run: |
          if git diff --exit-code; then
            echo "generated artifacts are current"
          else
            echo "generated artifacts changed during release verification" >&2
            git diff
            exit 1
          fi
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
